# Web service. Set this service's root directory to `web` so Railway uses
# this file and web/Dockerfile instead of the API image at the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "/docker-entrypoint.sh"
